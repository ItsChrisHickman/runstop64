<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>runstop64 HD GPU test</title>
  <!-- The HD view's GPU test (games/hdtest/main.ts): not linked from the loader. -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: #b2b2b2; font: 10px/1.3 ui-monospace, Menlo, Consolas, monospace; }
    main { max-width: 760px; padding: 4px 6px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .info { color: #edf171; margin-bottom: 4px; }
    h2 { font-size: 11px; margin: 4px 0 2px; color: #75cec8; font-weight: normal; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-items: start; }
    figure { margin: 0; min-width: 0; }
    figcaption { color: #7b7b7b; }
    .pic { display: block; width: 100%; aspect-ratio: 16 / 10; }
    .glwrap { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; }
    .glwrap canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .heat { display: block; width: 100%; image-rendering: pixelated; }
    .nums { font-size: 10px; }
    .bad { color: #ff7777; }
  </style>
</head>
<body>
  <main id="out"></main>
  <script type="module" src="./hdtest/main.ts"></script>
</body>
</html>
